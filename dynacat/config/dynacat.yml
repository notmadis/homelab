pages:
  - name: Home
    width: wide
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Productivity
                color: 210 70 55 # blue
                links:
                  - title: YouTube
                    url: https://www.youtube.com/
                    icon: si:youtube
                  - title: Gmail
                    url: https://mail.google.com/
                    icon: si:gmail
                  - title: Outlook
                    url: https://outlook.com/
                    icon: mdi:outlook
                  - title: Claude
                    url: https://claude.ai/
                    icon: si:claude

              - title: Selfhosted
                color: 160 55 50
                links:
                  - title: Linkding
                    url: https://your-service.example.com/
                  - title: Jellyfin
                    url: https://your-service.example.com/
                  - title: MeTube
                    url: https://your-service.example.com/
                  - title: Pi-hole
                    url: https://your-service.example.com/
                  - title: Grafana
                    url: https://your-service.example.com/
                  - title: Prometheus
                    url: https://your-service.example.com/

      - size: full
        widgets:
          - type: search
            search-engine: google
            autofocus: false # set true if you want the search bar focused on load

          - type: split-column
            widgets:
              # Left: r/selfhosted
              - type: reddit
                subreddit: selfhosted
                show-thumbnails: true
                limit: 8
              - type: bookmarks
                title: X
                groups:
                  - links:
                      - title: X
                        url: https://x.com/
                        icon: mdi:twitter

          # Bottom: calendar
          - type: calendar
            first-day-of-week: monday

      - size: small
        widgets:
          - type: weather
            location: Tallinn, Estonia
            units: metric
            hour-format: 24h
